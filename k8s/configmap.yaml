apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: microservices
data:
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: microservices
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  AI_SERVICE_URL: http://ai-service:8004
  LLM_MODEL: gpt-3.5-turbo
  MONGODB_HOST: mongodb
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: microservices
  REDIS_HOST: redis
  REDIS_PORT: "6379"
